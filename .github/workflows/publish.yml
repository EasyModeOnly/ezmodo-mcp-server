name: Publish to npm

# GENERATED. This file lives in the EzModo monorepo at
# .github/mirror-files/mcp-server/.github/workflows/publish.yml and is copied
# here by public-mirror.yml. An edit made in this repo is overwritten by the
# next sync.
#
# WHY PUBLISHING HAPPENS HERE (#2656). npm provenance attests the repository
# that RUNS the publish workflow, and refuses a private one:
#
#   422 ... Only public source repositories are supported when publishing
#   with provenance.
#
# The monorepo is private, this mirror is public, and it holds byte-for-byte
# the source that was synced. Publishing from here is what puts a provenance
# badge on @ezmodo/mcp-server without making the monorepo public.
#
# WHAT THIS DOES NOT DO: test. Everything that needs dependencies (the test
# suite, the plugin pin check) and the human approval stay in the monorepo's
# mcp-server-publish.yml, which dispatches this workflow only once they pass.
# The package has no build step, so publishing needs no install here.
#
# STAGED, NOT PUBLISHED. This runs `npm stage publish`: the version lands on
# npm as a staged release that nobody can install until a maintainer approves
# it with 2FA (`npm stage approve`). The npm Trusted Publisher for this package
# allows staging only. That approval is the real release gate, deliberately
# outside GitHub: a stolen GitHub token or a tampered workflow can stage a
# version, but it cannot make one installable.
#
# Dispatch-only, never on push: a sync commit is not a release decision.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version expected in mcp-server/package.json. Refuses to publish anything else."
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm Trusted Publishing, and the provenance it signs

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @ezmodo/mcp-server
    runs-on: ubuntu-latest
    # Named in the npm Trusted Publisher configuration. A dispatch from any
    # other environment, workflow or repository cannot publish.
    environment: npm-publish
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The sync that carries a version and the dispatch that publishes it are
      # separate events. Refusing a mismatch means a dispatch can never publish
      # whatever happens to be on main under someone else's version number.
      - name: Check the version is the one requested
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::mcp-server/package.json is $ACTUAL, dispatch asked for $EXPECTED"
            exit 1
          fi
          echo "Publishing $ACTUAL"

      # Before the skip check: `npm stage` does not exist in the npm 10 that
      # Node 22 ships, and Trusted Publishing needs >= 11.5.1 too.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Idempotent, same as the monorepo check (#2609): a re-run after a
      # partial failure must not stage twice. A version waiting for approval is
      # not on npm yet, so both states have to be checked. `npm stage list` may
      # need credentials this job does not have; if it cannot answer, staging
      # again is refused by npm for a duplicate version anyway.
      - name: Skip if already published or staged
        id: published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$(npm view "@ezmodo/mcp-server@$VERSION" version 2>/dev/null || true)" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already published."
            exit 0
          fi
          if npm stage list @ezmodo/mcp-server --json 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already staged and waiting for approval."
          fi

      - name: Verify tarball contents
        if: steps.published.outputs.already != 'true'
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for required in index.js tools/index.js handlers/index.js lib/version.js prompts/index.js; do
            grep -q " $required$" /tmp/pack.txt || { echo "::error::missing from tarball: $required"; exit 1; }
          done
          for excluded in __tests__/ coverage/ jest.config.js; do
            if grep -q " $excluded" /tmp/pack.txt; then
              echo "::error::dev file present in tarball: $excluded"; exit 1
            fi
          done

      - name: Stage with provenance
        if: steps.published.outputs.already != 'true'
        run: npm stage publish . --provenance --access public

      - name: What happens next
        if: steps.published.outputs.already != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## @ezmodo/mcp-server v$VERSION is STAGED, not published"
            echo
            echo "Nobody can install it until a maintainer approves it with 2FA, using the"
            echo "monorepo's \`scripts/approve-mcp-release.sh\`. That also re-runs"
            echo "*Mirror to public repos*, which moves the plugin pin to this version."
            echo
            echo "Plugin users keep the previous version until then."
          } | tee -a "$GITHUB_STEP_SUMMARY"
